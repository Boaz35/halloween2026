<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="body" cx="50%" cy="58%" r="58%">
      <stop offset="0" stop-color="#ffb05a"/>
      <stop offset="0.55" stop-color="#d9601f"/>
      <stop offset="1" stop-color="#7f2c0a"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="55%" r="50%">
      <stop offset="0.55" stop-color="#7cf5b0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7cf5b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7b0"/>
    </linearGradient>
  </defs>
  <!-- enchanted aura -->
  <circle cx="32" cy="35" r="29" fill="url(#aura)"/>
  <!-- curling magic wisp from the stem -->
  <path d="M33 13 C 38 8, 46 9, 45 3 C 50 7, 47 14, 40 14" fill="none" stroke="#7cf5b0" stroke-width="2.6" stroke-linecap="round"/>
  <!-- sparkle -->
  <path d="M52 15 l1.6 3.4 3.4 1.6 -3.4 1.6 -1.6 3.4 -1.6 -3.4 -3.4 -1.6 3.4 -1.6z" fill="#fff282"/>
  <!-- stem -->
  <path d="M29 17 C 29 12, 33 9, 36 10 L 34.5 18 Z" fill="#5f7d3a"/>
  <!-- pumpkin body: three lobes -->
  <ellipse cx="20" cy="38" rx="13" ry="18" fill="url(#body)"/>
  <ellipse cx="44" cy="38" rx="13" ry="18" fill="url(#body)"/>
  <ellipse cx="32" cy="37" rx="14" ry="20" fill="url(#body)"/>
  <!-- rib shading -->
  <path d="M25 22 C 21 32, 21 45, 25 55 M39 22 C 43 32, 43 45, 39 55" fill="none" stroke="#9a3a10" stroke-opacity="0.55" stroke-width="1.6"/>
  <!-- glowing face: angry slanted eyes, triangle nose, jagged grin -->
  <path d="M15 31 L27 34 L19 39 Z" fill="url(#fire)"/>
  <path d="M49 31 L37 34 L45 39 Z" fill="url(#fire)"/>
  <path d="M32 38 L35 43 L29 43 Z" fill="url(#fire)"/>
  <path d="M14 45 C 20 54, 44 54, 50 45 L 45 47 L 42 44 L 38 48 L 34 45 L 30 48 L 26 44 L 22 48 L 19 45 Z" fill="url(#fire)"/>
</svg>
