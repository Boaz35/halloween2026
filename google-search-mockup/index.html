<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teletubbies - Google Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%23FFC107' d='M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z'/%3E%3Cpath fill='%23FF3D00' d='m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z'/%3E%3Cpath fill='%234CAF50' d='M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z'/%3E%3Cpath fill='%231976D2' d='M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="page">
  <header class="top">
    <a class="logo" data-icon="logo" aria-label="Google"></a>
    <div class="searchbox">
      <input id="q" value="teletubbies" readonly tabindex="-1" aria-label="Search" autocomplete="off" spellcheck="false">
      <div class="sb-icons">
        <span class="ic ic-clear" data-icon="clear"></span>
        <span class="sb-divider"></span>
        <span class="ic" data-icon="mic"></span>
        <span class="ic" data-icon="lens"></span>
        <span class="ic ic-search" data-icon="search"></span>
      </div>
    </div>
    <div class="top-right">
      <span class="round-btn" data-icon="settings"></span>
      <span class="round-btn" data-icon="apps"></span>
      <a class="signin">Sign in</a>
    </div>
  </header>

  <nav class="tabs">
    <a>AI Mode</a>
    <a>All</a>
    <a class="active">Images</a>
    <a>Videos</a>
    <a>News</a>
    <a>Shopping</a>
    <a>Forums</a>
    <a class="dd">More <span class="caret" data-icon="caret"></span></a>
    <a class="dd tools">Tools <span class="caret" data-icon="caret"></span></a>
  </nav>

  <div class="chips-wrap">
    <div class="chips" id="chips"></div>
    <span class="chips-next" data-icon="chevron"></span>
  </div>

  <main id="grid" class="grid"></main>
</div>

<!-- The scare clip. Drop the file at media/scare.mp4 (see README.md). -->
<video id="scare" src="media/scare.mp4" preload="auto" playsinline></video>
<canvas id="fx"></canvas>
<div id="shield"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
